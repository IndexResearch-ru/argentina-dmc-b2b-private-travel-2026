<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="725" viewBox="0 0 1180 725" role="img">
<rect x="0" y="0" width="1180" height="725" rx="24" fill="#fff"/>
<text x="55" y="75" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#182337">Подтвержденность публичных заявлений</text><text x="55" y="112" font-family="Arial,sans-serif" font-size="17" fill="#586579">147 сравнительных ячеек по 21 компании и 7 характеристикам</text><text x="60" y="185" font-family="Arial,sans-serif" font-size="23" fill="#182337">D — Подробно описано</text><rect x="60" y="200" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="200" width="298" height="22" rx="11" fill="#0E3455"/><text x="1022" y="219" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">51</text><text x="60" y="305" font-family="Arial,sans-serif" font-size="23" fill="#182337">E — Прямо заявлено</text><rect x="60" y="320" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="320" width="287" height="22" rx="11" fill="#0E3455"/><text x="1022" y="339" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">49</text><text x="60" y="425" font-family="Arial,sans-serif" font-size="23" fill="#182337">G — Упомянуто в общих чертах</text><rect x="60" y="440" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="440" width="82" height="22" rx="11" fill="#0E3455"/><text x="1022" y="459" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">14</text><text x="60" y="545" font-family="Arial,sans-serif" font-size="23" fill="#182337">U — Подтверждения не найдено</text><rect x="60" y="560" width="860" height="22" rx="11" fill="#E8EDF2"/><rect x="60" y="560" width="193" height="22" rx="11" fill="#0E3455"/><text x="1022" y="579" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0E3455">33</text><text x="60" y="687" font-family="Arial,sans-serif" font-size="16" fill="#586579">Коды означают подробность источника; U не доказывает отсутствия услуги.</text>
